<!DOCTYPE html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BarberSYS</title>
  <link rel="stylesheet" href="../static/assets/cadastroBarbeiro.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
  <link rel="shortcut icon" href="TelaLogin/assets/images/Logo.png" type="image/x-icon" />
</head>
<script src="../static/assets/script.js" defer></script>
<body class="container">
  <div class="shadow">
    <header class="header">
      <div class="header__container">
        <a href="home.html"><img class="logo" src="../static/assets/images/Logo.png" alt="Caveira"></a>
        <p>BarberSys - Sistema para Barberarias</p>
      </div>
      <h1>Barbeiros</h1>
    </header>

    <main class="main">
      <section class="container__botoes">
        <button class="btn" type="button" onclick="incluirB()">Incluir Barbeiro</button>
        <button class="btn" type="button" onclick="listarBarbeiro()">Listar Barbeiros</button><br>
      </section>
      <div class="container__btn">
        <button class="btn" type="button" onclick="voltarHome()">Voltar</button>
      </div>
      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      {% for categoria, msg in messages %}
      <div class="flash {{ categoria }}">{{ msg }}</div>
      {% endfor %}
      {% endif %}
      {% endwith %}
    </main>
  </div>
</body>
</html>
